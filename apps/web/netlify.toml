# Proxy API + SSE requests to the Render backend so the browser treats them as
# same-origin. This makes the session cookie first-party and avoids the
# cross-site / third-party-cookie blocking that breaks cookie auth when the web
# app and API live on different domains.
#
# Update the `to` host if your Render service URL changes.
[[redirects]]
  from = "/api/*"
  to = "https://aegis-xrsi.onrender.com/api/:splat"
  status = 200
  force = true
